<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Đăng nhập - Quản lý hộ gia đình</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">
  <main class="login-card">
    <h1>QUẢN LÝ HỘ GIA ĐÌNH</h1>
    <p class="muted">Đăng nhập bằng tài khoản đã được cấp.</p>
    <form id="loginForm" class="stack">
      <label>Email<input id="email" type="email" required autocomplete="username" /></label>
      <label>Mật khẩu<input id="password" type="password" required autocomplete="current-password" /></label>
      <button class="btn primary" type="submit">Đăng nhập</button>
      <p id="loginMessage" class="message"></p>
    </form>
  </main>
  <script type="module" src="login.js"></script>
</body>
</html>
